services:
  - type: web
    name: cpgist-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: cpgist
      - key: CORS_ORIGINS
        value: https://cp-gist.vercel.app,https://cpgist.vercel.app
      - key: APP_TZ
        value: Asia/Kolkata
